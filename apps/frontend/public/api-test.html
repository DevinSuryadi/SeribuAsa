<!doctype html>
<html>
  <head>
    <title>API Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      pre {
        background: #f5f5f5;
        padding: 10px;
        overflow-x: auto;
      }
      button {
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
      }
      .success {
        color: green;
      }
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>SeribuAsa API Test</h1>

    <h2>Step 1: Login</h2>
    <button onclick="login()">Login as demo-donor@gmail.com</button>
    <div id="loginResult"></div>

    <h2>Step 2: Get Donations</h2>
    <button onclick="getDonations()" id="donationsBtn" disabled>Get Donations</button>
    <div id="donationsResult"></div>

    <h2>Console Output</h2>
    <pre id="console"></pre>

    <script>
      const SUPABASE_URL = "https://ydglsytahhjdoznvnfnc.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkZ2xzeXRhaGhqZG96bnZuZm5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxOTM2MjYsImV4cCI6MjA5MDc2OTYyNn0.VKvWOtOMZ48NvPNwBuI0XNb1dsIXcjrkWIqsitls088";
      const API_BASE_URL = "http://localhost:8000/api/v1";

      let accessToken = null;
      let userId = null;

      function log(msg) {
        console.log(msg);
        document.getElementById("console").textContent += msg + "\n";
      }

      async function login() {
        log("Logging in...");
        try {
          const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
            method: "POST",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email: "demo-donor@gmail.com",
              password: "Demo123!",
            }),
          });

          const data = await response.json();

          if (response.ok) {
            accessToken = data.access_token;
            userId = data.user.id;
            log(`Login successful! User ID: ${userId}`);
            document.getElementById("loginResult").innerHTML =
              `<p class="success">Login successful!</p>
                         <p>User ID: ${userId}</p>
                         <p>Email: ${data.user.email}</p>`;
            document.getElementById("donationsBtn").disabled = false;
          } else {
            log(`Login failed: ${JSON.stringify(data)}`);
            document.getElementById("loginResult").innerHTML =
              `<p class="error">Login failed: ${data.message}</p>`;
          }
        } catch (error) {
          log(`Error: ${error.message}`);
          document.getElementById("loginResult").innerHTML =
            `<p class="error">Error: ${error.message}</p>`;
        }
      }

      async function getDonations() {
        log("Fetching donations...");
        try {
          const response = await fetch(`${API_BASE_URL}/donations/`, {
            headers: {
              Authorization: `Bearer ${accessToken}`,
            },
          });

          const data = await response.json();

          if (response.ok) {
            log(`Donations received: ${data.total} total`);
            document.getElementById("donationsResult").innerHTML =
              `<p class="success">Donations found: ${data.total}</p>
                         <pre>${JSON.stringify(data, null, 2)}</pre>`;
          } else {
            log(`Error: ${JSON.stringify(data)}`);
            document.getElementById("donationsResult").innerHTML =
              `<p class="error">Error: ${JSON.stringify(data)}</p>`;
          }
        } catch (error) {
          log(`Error: ${error.message}`);
          document.getElementById("donationsResult").innerHTML =
            `<p class="error">Error: ${error.message}</p>`;
        }
      }
    </script>
  </body>
</html>
