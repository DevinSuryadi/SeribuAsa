[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["annotation-unchecked", "arg-type", "assignment", "return-value", "call-overload", "var-annotated", "no-any-return", "misc"]
