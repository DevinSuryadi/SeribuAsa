name: Backend CI

on:
  push:
    branches:
      - main
      - staging
      - "feature/**"
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        working-directory: apps/backend
        run: ruff check .

      - name: Run Mypy type checker
        working-directory: apps/backend
        run: |
          pip install types-python-jose types-passlib types-requests
          mypy app/ --ignore-missing-imports --disable-error-code=annotation-unchecked || true

  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test .env file
        working-directory: apps/backend
        run: |
          cat > .env << EOF
          TEST_MODE=true
          DATABASE_URL=sqlite:///:memory:
          APP_NAME=NutriGuard API (Test)
          JWT_SECRET_KEY=test-secret-key-for-ci-only
          EOF

      - name: Run unit tests with coverage
        working-directory: apps/backend
        run: |
          pip install pytest-cov
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=0

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/backend/htmlcov/
        if: always()
