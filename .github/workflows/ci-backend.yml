name: Backend CI

on:
  push:
    branches:
      - main
      - staging
      - "feature/**"
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  docker:
    name: Validate Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --tag seribuasa-backend:ci apps/backend

      - name: Verify application import
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite:///:memory: \
            -e TEST_MODE=true \
            -e DEV_MODE=false \
            -e SCHEDULER_ENABLED=false \
            seribuasa-backend:ci \
            python -c "from app.main import app; print(app.title)"

  lint:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        working-directory: apps/backend
        run: ruff check .

  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        working-directory: apps/backend
        env:
          TEST_MODE: "true"
          DEV_MODE: "false"
          SCHEDULER_ENABLED: "false"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=html

      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: apps/backend/htmlcov/
          if-no-files-found: error
        if: always()
